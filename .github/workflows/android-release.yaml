name: Flutter - Android Build Release

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .env file (ENV)
        run: echo "${{secrets.ENV}}" > .env

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.6'
      - run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Autoformat Dart files
        run: dart format .

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart code
        run: flutter analyze --fatal-warnings

      # 🔐 NEW: Decode keystore for release signing
      - name: Decode release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 🏗️ Build signed release APK
      - name: Build Android release artifact
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --build-name=1.0.0 --build-number=1

      # 📦 Upload build output
      - name: Upload Android artifact
        uses: actions/upload-artifact@v5
        with:
          name: supatask.apk
          path: build/app/outputs/flutter-apk/app-release.apk
